[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "iqbf-ulima-back"
version = "0.1.0"
description = "API transaccional del sistema IQBF de la Universidad de Lima"
requires-python = ">=3.12"
dependencies = [
  "email-validator==2.3.0",
  "fastapi==0.140.2",
  "psycopg[binary]==3.3.4",
  "psycopg-pool==3.3.1",
  "pydantic-settings==2.14.2",
  "PyJWT==2.13.0",
  "pwdlib[argon2,bcrypt]==0.3.0",
  "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
